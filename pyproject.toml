[project]
name = "anna"
version = "1.0.0"
description = "AUSG Notoriously Nerdy Assistant"
authors = [{ name = "AUSG Crew" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cachetools~=5.3.1",
    "flask~=3.1.3",
    "gspread~=5.10.0",
    "gspread-formatting~=1.1.2",
    "gunicorn~=26.0.0",
    "pydantic~=2.0.3",
    "pydantic-settings~=2.0.2",
    "requests~=2.31.0",
    "slack-bolt~=1.18.0",
    "slack-sdk~=3.21.3",
]

[dependency-groups]
dev = [
    "black~=23.7.0",
    "pytest~=7.4.0",
    "pytest-cov~=4.1.0",
    "ruff~=0.0.278",
]

[tool.uv]
required-version = ">=0.13.4"
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 120
