[project]
name = "anna"
version = "1.0.0"
description = "AUSG Notoriously Nerdy Assistant"
authors = [{ name = "AUSG Crew" }]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "cachetools~=7.2.6",
    "flask~=3.1.3",
    "gspread~=6.2.1",
    "gspread-formatting~=1.2.1",
    "gunicorn~=26.2.0",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.16.1",
    "requests~=2.34.2",
    "slack-bolt~=1.30.0",
    "slack-sdk~=3.45.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "ruff~=0.17.3",
]

[tool.uv]
required-version = ">=0.13.4"
package = false

[tool.pytest]
testpaths = ["test"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "."]
