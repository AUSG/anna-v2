name: ANNA get physical fitness test

on: pull_request

jobs:
  ci:
    name: ANNA get physical fitness test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: ready
        run: uv sync --locked
      - name: go
        run: make ci
